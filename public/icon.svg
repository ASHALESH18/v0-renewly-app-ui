<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Calendar body -->
  <rect x="4" y="8" width="24" height="20" rx="3" stroke="#C7A36A" stroke-width="2" fill="none"/>
  <!-- Calendar header line -->
  <line x1="4" y1="13" x2="28" y2="13" stroke="#C7A36A" stroke-width="1.5"/>
  <!-- Ring binding tabs -->
  <rect x="10" y="4" width="3" height="6" rx="1.5" fill="#C7A36A"/>
  <rect x="19" y="4" width="3" height="6" rx="1.5" fill="#C7A36A"/>
  <!-- Letter R -->
  <text x="16" y="23" font-family="Georgia, serif" font-size="11" font-weight="600" fill="#C7A36A" text-anchor="middle">R</text>
</svg>
