<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#0A0A0D"/>
  <!-- Calendar outline -->
  <rect x="12" y="16" width="40" height="36" rx="6" stroke="#C7A36A" stroke-width="2.5" fill="none"/>
  <!-- Calendar header line -->
  <line x1="12" y1="26" x2="52" y2="26" stroke="#C7A36A" stroke-width="2"/>
  <!-- Calendar binding rings -->
  <rect x="22" y="12" width="4" height="8" rx="2" fill="#C7A36A"/>
  <rect x="38" y="12" width="4" height="8" rx="2" fill="#C7A36A"/>
  <!-- Letter R -->
  <text x="32" y="44" font-family="Georgia, serif" font-size="20" font-weight="500" fill="#C7A36A" text-anchor="middle" dominant-baseline="middle">R</text>
</svg>
